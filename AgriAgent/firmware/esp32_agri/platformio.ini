; AgriAgents ESP32 Firmware - PlatformIO Configuration
; Multi-modelo: auto-detecta placa (WROOM, WROVER, S2, S3, C3, C6, H2, P4)

[env:auto]
platform = espressif32
framework = arduino
board = auto                    ; Auto-detect via USB vid/pid
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags =
    -D FIRMWARE_VERSION="1.0.0"
    -D FIRMWARE_BUILD_DATE="__DATE__ __TIME__"
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; Librerías
lib_deps =
    ; ArduinoJson (para parsing JSON)
    bblanchon/ArduinoJson@^7.0.0

    ; TinyGSM (para modems celulares)
    vshymanskyy/TinyGSM@^0.12.0

    ; HTTP Client (para OTA/API)
    knolleary/PubSubClient@^2.8   ; MQTT si se usa

; Particiones: SIN OTA (factory + nvs + spiffs)
board_build.partitions = default_4MB.csv
; O custom para más espacio SPIFFS:
; board_build.partitions = partitions_custom.csv

; Flash frequency
board_build.flash_mode = dio
board_build.f_cpu = 240000000L

; Upload
upload_speed = 921600
upload_port = /dev/ttyUSB0

; ──────────────────────────────────────────────────────────────
; Variantes específicas por modelo (se auto-detecta)
; ──────────────────────────────────────────────────────────────

[env:esp32-devkit-v1]
extends = env:auto
board = esp32dev                    ; ESP32-DevKitC (WROOM-32E/UE)
build_flags = ${env:auto.build_flags} -D BOARD_MODEL=BOARD_ESP32_DEVKIT_V1

[env:esp32-wrover]
extends = env:auto
board = esp32-wrover-kit            ; ESP32-WROVER-E/IE (PSRAM)
build_flags = ${env:auto.build_flags} -D BOARD_MODEL=BOARD_ESP32_WROVER

[env:esp32-s2]
extends = env:auto
board = esp32-s2-saola-1            ; ESP32-S2 DevKitC-1 / SAOLA-1
build_flags = ${env:auto.build_flags} -D BOARD_MODEL=BOARD_ESP32_S2_SAOLA

[env:esp32-s3]
extends = env:auto
board = esp32-s3-devkitc-1          ; ESP32-S3 DevKitC-1
build_flags = ${env:auto.build_flags} -D BOARD_MODEL=BOARD_ESP32_S3_DEVKITC1

[env:esp32-c3]
extends = env:auto
board = esp32-c3-devkitc-02         ; ESP32-C3 DevKitC-02
build_flags = ${env:auto.build_flags} -D BOARD_MODEL=BOARD_ESP32_C3_DEVKITC02

[env:esp32-c6]
extends = env:auto
board = esp32-c6-devkitc-06         ; ESP32-C6 DevKitC-06
build_flags = ${env:auto.build_flags} -D BOARD_MODEL=BOARD_ESP32_C6_DEVKITC06

[env:esp32-h2]
extends = env:auto
board = esp32-h2-devkitc-07         ; ESP32-H2 DevKitC-07
build_flags = ${env:auto.build_flags} -D BOARD_MODEL=BOARD_ESP32_H2_DEVKITC07

[env:esp32-p4]
extends = env:auto
board = esp32-p4-devkit             ; ESP32-P4 DevKit
build_flags = ${env:auto.build_flags} -D BOARD_MODEL=BOARD_ESP32_P4_DEVKIT

; ──────────────────────────────────────────────────────────────
; Variantes con Cellular (TinyGSM)
; ──────────────────────────────────────────────────────────────

[env:esp32-sim7000]
extends = env:esp32-devkit-v1
build_flags = ${env:esp32-devkit-v1.build_flags} -D TINY_GSM_MODEM_SIM7000 -D TINY_GSM_RX_BUFFER=1024

[env:esp32-sim7600]
extends = env:esp32-devkit-v1
build_flags = ${env:esp32-devkit-v1.build_flags} -D TINY_GSM_MODEM_SIM7600 -D TINY_GSM_RX_BUFFER=1024

[env:esp32-a7670]
extends = env:esp32-devkit-v1
build_flags = ${env:esp32-devkit-v1.build_flags} -D TINY_GSM_MODEM_A7670 -D TINY_GSM_RX_BUFFER=1024

[env:lilygo-t-sim7000g]
extends = env:esp32-sim7000
board = lilygo-t-sim7000g           ; LilyGo T-SIM7000G

[env:lilygo-t-a7670]
extends = env:esp32-a7670
board = lilygo-t-a7670              ; LilyGo T-A7670E

[env:lilygo-t-sim7600]
extends = env:esp32-sim7600
board = lilygo-t-sim7600            ; LilyGo T-SIM7600G

; ──────────────────────────────────────────────────────────────
; Con Ethernet (W5500/ENC28J60)
; ──────────────────────────────────────────────────────────────

[env:esp32-eth]
extends = env:esp32-devkit-v1
build_flags = ${env:esp32-devkit-v1.build_flags} -D ETH_H

; ──────────────────────────────────────────────────────────────
; Con LoRa (SX1276/SX1262)
; ──────────────────────────────────────────────────────────────

[env:esp32-lora]
extends = env:esp32-devkit-v1
build_flags = ${env:esp32-devkit-v1.build_flags} -D LORA_H
lib_deps = ${env:auto.lib_deps}
    ; RadioLib para LoRa
    jgromes/RadioLib@^6.0.0

; ──────────────────────────────────────────────────────────────
; Production build (optimizado, sin debug)
; ──────────────────────────────────────────────────────────────

[env:production]
extends = env:auto
build_flags =
    -D FIRMWARE_VERSION="1.0.0"
    -D FIRMWARE_BUILD_DATE="__DATE__ __TIME__"
    -D CORE_DEBUG_LEVEL=0
    -O2
    -fno-exceptions
    -fno-rtti
    -flto
    -ffunction-sections
    -fdata-sections

; ──────────────────────────────────────────────────────────────
; Custom partitions (para más SPIFFS si no hay OTA)
; ──────────────────────────────────────────────────────────────

; partitions_custom.csv:
; # Name,   Type, SubType, Offset,  Size, Flags
; nvs,      data, nvs,     0x9000,  0x6000,
; phy_init, data, phy,     0xf000,  0x1000,
; factory,  app,  factory, 0x10000, 0x100000,
; spiffs,   data, spiffs,  0x110000,0xEF0000,
;
; Para usar: board_build.partitions = partitions_custom.csv
